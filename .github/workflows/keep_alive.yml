name: Render Keep-Alive Pinger

on:
  schedule:
    # Run every 10 minutes (UTC) to keep Render awake 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Sending keep-alive ping to Render..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://potholesense-ai.onrender.com/health)
          echo "Render response status: $STATUS"
